steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: PREPARE_MLRUNS
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        rm -rf mlruns
        mkdir -p mlruns
        gcloud storage cp --recursive "${_MLRUNS_GCS_PATH}" ./mlruns
        if [ -d mlruns/mlruns ]; then
          cp -R mlruns/mlruns/. mlruns/
          rm -rf mlruns/mlruns
        fi
        test -d mlruns

  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: TEST
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        uv sync &&
        uv run pytest
    env:
      - "ENV=${_ENV}"
      - "MLFLOW_SERVER=${_TRACKING_URI}"
      - "MLFLOW_REGISTRY_NAME=${_REGISTRY_NAME}"
    waitFor: ["PREPARE_MLRUNS"]

  - name: "gcr.io/cloud-builders/docker"
    id: BUILD
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
      - "."
    waitFor: ["TEST"]

  - name: "gcr.io/cloud-builders/docker"
    id: PUSH
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
    waitFor: ["BUILD"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: DEPLOY
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "80"
      - "--service-account"
      - "purchase-predict-api-sa@$PROJECT_ID.iam.gserviceaccount.com"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "ENV=${_ENV},MLFLOW_SERVER=file:///app/mlruns,MLFLOW_REGISTRY_NAME=${_REGISTRY_NAME},WEB_CONCURRENCY=1"
    waitFor: ["PUSH"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"

logsBucket: gs://purchase-predict-haroun-2026/logs_build_cloud_build

timeout: 1800s

substitutions:
  _ENV: staging
  _IMAGE_TAG: latest
  _MLRUNS_GCS_PATH: gs://purchase-predict-haroun-2026/preprod/latest/mlruns
  _REGION: europe-west1
  _REGISTRY_NAME: purchase_predict
  _REPOSITORY: purchased-docker
  _SERVICE: purchase-predict-api
  _TRACKING_URI: file:///workspace/mlruns
