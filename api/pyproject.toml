[project]
name = "purchase-predict-api"
version = "0.1.0"
description = "Flask API serving the purchase_predict model from an MLflow registry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "lightgbm>=4.6.0",
    "mlflow==2.20.2",
    "pandas<3.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
