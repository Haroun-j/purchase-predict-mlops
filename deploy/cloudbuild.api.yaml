# Build the API image and redeploy the Cloud Run service.
#
# Submitted from the repository root, by hand with deploy/scripts/deploy-api-cloud-run.sh
# or by deploy/cloudbuild.preprod.yaml right after a model has been trained. The MLflow
# store exported by the training build is fetched from GCS and baked into the image, so
# the service needs no tracking server at runtime.
steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: PREPARE_MLRUNS
    dir: api
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        rm -rf mlruns
        mkdir -p mlruns
        gcloud storage cp --recursive "${_MLRUNS_GCS_PATH}" ./mlruns
        if [ -d mlruns/mlruns ]; then
          cp -R mlruns/mlruns/. mlruns/
          rm -rf mlruns/mlruns
        fi
        test -d mlruns/models

  - name: "ghcr.io/astral-sh/uv:python3.12-trixie-slim"
    id: TEST
    dir: api
    entrypoint: /bin/sh
    args:
      - "-c"
      - |
        apt-get update &&
        apt-get install -y --no-install-recommends libgomp1 &&
        rm -rf /var/lib/apt/lists/* &&
        uv sync &&
        uv run pytest
    env:
      - "ENV=${_ENV}"
      - "MLFLOW_SERVER=file:///workspace/api/mlruns"
      - "MLFLOW_REGISTRY_NAME=${_REGISTRY_NAME}"
    waitFor: ["PREPARE_MLRUNS"]

  - name: "gcr.io/cloud-builders/docker"
    id: BUILD
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
      - "api"
    waitFor: ["TEST"]

  - name: "gcr.io/cloud-builders/docker"
    id: PUSH
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
    waitFor: ["BUILD"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: DEPLOY
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "80"
      - "--service-account"
      - "${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--timeout"
      - "300"
      - "--set-env-vars"
      - "ENV=${_ENV},MLFLOW_SERVER=file:///app/mlruns,MLFLOW_REGISTRY_NAME=${_REGISTRY_NAME},WEB_CONCURRENCY=1"
    waitFor: ["PUSH"]

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}"

timeout: 1800s

substitutions:
  _ENV: staging
  _IMAGE_TAG: latest
  _MLRUNS_GCS_PATH: gs://your-gcs-bucket/preprod/latest/mlruns
  _REGION: europe-west1
  _REGISTRY_NAME: purchase_predict
  _REPOSITORY: purchased-docker
  _SERVICE: purchase-predict-api
  _SERVICE_ACCOUNT: purchase-predict-api-sa
